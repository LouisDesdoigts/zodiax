[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zodiax"
version = "0.6.0"
description = "Equinox extension for scientific programming."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Louis Desdoigts", email = "louis.desdoigts@gmail.com"}]
dependencies = [
    "jax",
    "jaxlib",
    "equinox",
    "optax",
    "numpy",
    "wadler-lindig>=0.1.3",
]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/LouisDesdoigts/zodiax"
Documentation = "https://louisdesdoigts.github.io/zodiax/"
Issues = "https://github.com/LouisDesdoigts/zodiax/issues"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
]

dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "pre-commit",
    "zensical",
    "mkdocstrings-python",
    "build",
    "twine"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
source = ["zodiax"]
relative_files = true

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E = pycodestyle, F = Pyflakes, I = Isort (replaces your separate isort config)
select = ["E", "F", "I"]
ignore = [
    "E731", # Allow lambda assignments
    "E741", # Allow ambiguous variable names (l, O, I)
    "F722", # Allow syntax errors in forward type annotations
    "I001", # Allow isort to manage imports without interference
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.black]
line-length = 88

[tool.setuptools.packages.find]
where = ["src"]

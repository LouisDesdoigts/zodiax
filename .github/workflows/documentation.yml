name: Documentation
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: documentation-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: python -m pip install ".[dev]"
      - name: Build documentation
        run: |
          zensical build --strict
          python docs/scripts/check_links.py
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation publishing dependencies
        run: |
          python -m pip install ".[dev]"
          python -m pip install git+https://github.com/squidfunk/mike.git
      - name: Deploy main documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          ZODIAX_DOCS_SITE_NAME="Zodiax main" mike deploy --config-file mkdocs.yml --push main
